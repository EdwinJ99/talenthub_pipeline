services:
  # ============================================================================
  # WEB — image ini TIDAK dijalankan sebagai web server publik (website-nya
  # sudah di-deploy di Vercel: https://talenthub-agum.vercel.app/).
  # Di VPS, image ini cuma dipakai sebagai "wadah" buat menjalankan script
  # satuan lewat cron (docker compose run), bukan buat serve halaman web.
  # Karena itu TIDAK ada port yang di-publish ke luar.
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: talenthub-pipeline:latest
    env_file:
      - .env

  # ============================================================================
  # Script pipeline (run-pipeline.ts, process-staging.ts,
  # discover-trending.ts, dll) TIDAK dijalankan sebagai service yang
  # nyala terus — semuanya "jalan sekali lalu selesai", jadi dijadwalkan
  # lewat CRON DI LEVEL VPS yang manggil:
  #   docker compose run --rm web npx tsx scripts/<nama-script>.ts
  # Lihat DEPLOY-VPS.md bagian "Jadwal cron" untuk setup lengkapnya.
  # ============================================================================

# Catatan:
# - Tidak ada service "db" di sini karena DATABASE_URL mengarah ke
#   Neon (Postgres cloud), jadi tidak perlu container Postgres lokal.